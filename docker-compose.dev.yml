# 本地开发与测试用：PostgreSQL 18.6 与 OpenSearch 3.9.0（版本与开发文档 3.3 一致）。
# OpenSearch 使用 docker/opensearch/Dockerfile 构建的镜像，带 smartcn 与 icu 中文分词插件；
# 首次启动会自动构建。2026-11-12 已在 macOS（OrbStack）上实际启动并跑通全部测试。
#
#   docker compose -f docker-compose.dev.yml up -d --build
#   export EAER_TEST_ADMIN_URL=postgresql://postgres:postgres@localhost:5432/postgres
#   export EAER_TEST_OPENSEARCH_URL=http://localhost:9200
#   python -m pytest -q
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10
  opensearch:
    build: docker/opensearch
    image: eaer-opensearch:3.9.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health"]
      interval: 10s
      retries: 20
