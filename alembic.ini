[alembic]
script_location = eaer/db/migrations
prepend_sys_path = .
# 连接串由环境变量 EAER_DATABASE_URL 提供，见 eaer/db/migrations/env.py

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
